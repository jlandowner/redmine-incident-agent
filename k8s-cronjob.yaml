apiVersion: batch/v1
kind: CronJob
metadata:
  name: redmine-incident-agent
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: agent
              image: YOUR_REGISTRY/redmine-incident-agent:latest
              envFrom:
                - secretRef:
                    name: redmine-incident-agent
